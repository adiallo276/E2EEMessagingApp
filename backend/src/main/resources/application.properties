spring.application.name=messaging-backend
spring.datasource.url=jdbc:h2:mem:messagingdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Increase max HTTP request size for image uploads (10MB)
server.tomcat.max-http-form-post-size=10485760
server.tomcat.max-swallow-size=10485760
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB